apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app: storefront
    tier: web
  annotations:
    deployment.kubernetes.io/revision: "7"
spec:
  replicas: 3
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: api
          image: ghcr.io/example/api:1.4.2 # promoted by CI
          env:
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
        - name: metrics
          image: ghcr.io/example/metrics:0.9.0
          env: []
