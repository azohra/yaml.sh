name: CI
on:
  push:
    branches: [main]
  pull_request: {}
env:
  FORCE_COLOR: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make lint
  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        awk: [mawk, busybox, original]
    steps:
      - uses: actions/checkout@v4
      - run: make test
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - run: ./deploy.sh
