name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare token reaches the whole account, so it is held in an
    # environment only main may use.
    environment:
      name: automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: mise run deploy
