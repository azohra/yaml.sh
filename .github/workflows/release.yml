name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Bosun's key mints a token for every repository Bosun is installed in,
    # and the Cloudflare token reaches the whole account, so both are held in
    # an environment only main and a v* tag may use.
    environment:
      name: automation
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        id: bosun
        with:
          client-id: ${{ vars.BOSUN_CLIENT_ID }}
          private-key: ${{ secrets.BOSUN_PRIVATE_KEY }}
          owner: azohra
          repositories: homebrew-tools
          permission-contents: write
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOMEBREW_TOOLS_TOKEN: ${{ steps.bosun.outputs.token }}
        run: mise run release
