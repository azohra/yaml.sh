name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: bosun
        with:
          client-id: ${{ vars.BOSUN_CLIENT_ID }}
          private-key: ${{ secrets.BOSUN_PRIVATE_KEY }}
          owner: azohra
          repositories: homebrew-tools
          permission-contents: write
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOMEBREW_TOOLS_TOKEN: ${{ steps.bosun.outputs.token }}
        run: mise run release
