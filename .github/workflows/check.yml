name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Site and docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      # mise's task artifact cache: a task whose inputs match an entry replays
      # instead of running. Pull requests read what main has proven; only main
      # writes, so a pull request can never seed an entry main relies on.
      - id: task-cache
        run: echo "dir=$(mise cache path)/task-artifacts" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.task-cache.outputs.dir }}
          key: mise-tasks-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            mise-tasks-${{ runner.os }}-${{ runner.arch }}-
      - name: Validate generated pages, links, assets, and docs JavaScript
        run: mise run check:docs
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.task-cache.outputs.dir }}
          key: mise-tasks-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      # mise's task artifact cache: a task whose inputs match an entry replays
      # instead of running. Pull requests read what main has proven; only main
      # writes, so a pull request can never seed an entry main relies on.
      - id: task-cache
        run: echo "dir=$(mise cache path)/task-artifacts" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.task-cache.outputs.dir }}
          key: mise-tasks-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            mise-tasks-${{ matrix.os }}-
      - name: Build, lint, and test
        run: mise run check:runtime
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.task-cache.outputs.dir }}
          key: mise-tasks-${{ matrix.os }}-${{ github.sha }}

  linux-portability:
    name: Linux AWK and shell portability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      # mise's task artifact cache: a task whose inputs match an entry replays
      # instead of running. Pull requests read what main has proven; only main
      # writes, so a pull request can never seed an entry main relies on.
      - id: task-cache
        run: echo "dir=$(mise cache path)/task-artifacts" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.task-cache.outputs.dir }}
          key: mise-tasks-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            mise-tasks-${{ runner.os }}-${{ runner.arch }}-
      - run: mise run check:linux-portability
      - if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.task-cache.outputs.dir }}
          key: mise-tasks-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  check:
    name: Check
    needs: [docs, test, linux-portability]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify results
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: test "$RESULTS" = 'success,success,success'
