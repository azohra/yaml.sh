name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      docs: ${{ steps.scope.outputs.docs }}
      docs_portability: ${{ steps.scope.outputs.docs_portability }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select required checks
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          runtime=false
          docs=false
          docs_portability=false

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            runtime=true
            docs=true
            docs_portability=true
            printf '%s\n' '(manual run: all checks)' > "$RUNNER_TEMP/changed-files"
          elif [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          else
            git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          fi

          while IFS= read -r file; do
            case "$file" in
              .github/workflows/*|Makefile|mise.toml)
                runtime=true
                docs=true
                docs_portability=true
                ;;
              ysh|_static/_www/install)
                runtime=true
                docs=true
                ;;
              build/docs.sh|build/docs-*.awk|test/docs.sh)
                runtime=true
                docs=true
                docs_portability=true
                ;;
              CONTRIBUTING.md|DESIGN.md|README.md|SECURITY.md|VERSIONING.md|CHANGELOG.md|_static/*|build/docbuilder.awk)
                docs=true
                ;;
              src/*|build/*|test/*|bench/*)
                runtime=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

          {
            printf 'runtime=%s\n' "$runtime"
            printf 'docs=%s\n' "$docs"
            printf 'docs_portability=%s\n' "$docs_portability"
          } >> "$GITHUB_OUTPUT"

          {
            printf '### CI scope\n\n'
            printf -- '- Runtime portability: `%s`\n' "$runtime"
            printf -- '- Site and docs: `%s`\n' "$docs"
            printf -- '- Docs generator portability: `%s`\n\n' "$docs_portability"
            printf 'Changed paths:\n```text\n'
            sed -n '1,100p' "$RUNNER_TEMP/changed-files"
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

  docs:
    name: Site and docs
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - name: Validate generated pages, links, assets, and docs JavaScript
        run: mise run check:docs

  test:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - name: Build, lint, and test
        run: mise run check:runtime

  linux-portability:
    name: Linux AWK and shell portability
    needs: changes
    if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.docs_portability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 24h
      - run: mise run check:linux-portability
