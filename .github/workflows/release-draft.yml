name: Release draft

on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: release-draft-${{ github.event_name }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  release:
    uses: azohra/.github/.github/workflows/release-draft.yml@main
    permissions:
      contents: write
      pull-requests: write
