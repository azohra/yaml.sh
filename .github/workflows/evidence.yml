name: Release evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * 1'

permissions:
  contents: read

jobs:
  evidence:
    name: Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        with:
          minimum_release_age: 24h
      # The battery, against the pinned corpora it fetches. Identical to what
      # `mise run evidence` does on a contributor's machine.
      - run: mise run evidence
      - name: Measure with BusyBox AWK
        run: mise run evidence:busybox
