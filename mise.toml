# The Makefile keeps the build recipes; these verbs are the fleet-invariant
# contract over it.

[settings]
# Task artifact caching, which check:runtime and check:docs are built on.
experimental = true

[vars]
changelog_config = "https://gist.githubusercontent.com/azohra/2bf7f60736469fa8a81ffcb67214e572/raw/cliff.toml"

[env]
# Where the pinned corpora live. Gitignored: fetched, never committed.
YSH_EVIDENCE_DIR = "{{config_root}}/.evidence"

[tools]
wrangler = "4.129.0"
node = "24"
make = "4.4.1"
"aqua:orhun/git-cliff" = "2.14.1"
# make lint runs it; without it `mise run check` fails on a clean machine.
shellcheck = "0.11.0"
# The differential oracle for make differential.
yq = "4.53.6"

# What this repository needs in its environment, and which of those
# disclosure would compromise. Read it; do not restate it.
[tasks."env:contract"]
hide = true
description = "Every variable this repository needs, and whether it is a secret"
run = """
cat <<'CONTRACT'
secret  BOSUN_PRIVATE_KEY
secret  CLOUDFLARE_API_TOKEN
secret  GITHUB_TOKEN
value   BOSUN_CLIENT_ID
CONTRACT
"""

# Both halves of the battery are content-addressed: a run whose inputs are
# unchanged restores its result instead of repeating it, on a laptop and on a
# runner alike. `sources` is an assertion — every file the half reads must
# appear, or an unchanged-looking tree can go green on work it never did.
[tasks."check:runtime"]
outputs = []
cache = { enabled = true }
description = "Build ysh, lint scripts, and run the suites"
sources = [
  "src/**",
  "build/**",
  "test/**",
  "bench/**",
  "_static/_www/install",
  "Makefile",
  "mise.toml",
]
run = "make ysh lint test"

[tasks."check:docs"]
outputs = []
cache = { enabled = true }
# guidance.sh reads the prose against the source it documents, so src/ and the
# root Markdown are inputs here too, not just _static/.
description = "Build ysh, then validate the site and its generated pages"
sources = [
  "src/**",
  "build/**",
  "test/**",
  "_static/**",
  "*.md",
  "Makefile",
  "mise.toml",
  "wrangler.jsonc",
]
run = ["make ysh docs-check", "wrangler deploy --dry-run"]

# Linux-only portability runs in Docker so the same proof is available on a
# laptop and a runner. The native CI matrix remains the macOS portability
# authority; an Ubuntu container cannot prove those implementations.
[tasks."check:linux-portability"]
outputs = []
cache = { enabled = true }
description = "Test the Linux AWK and shell matrix in Ubuntu 26.04 (requires Docker)"
# The container copies the tree and runs the suites and docs-check, so its
# inputs are both halves of the battery plus what shapes the image.
sources = [
  "src/**",
  "build/**",
  "test/**",
  "bench/**",
  "_static/**",
  "*.md",
  "Makefile",
  "mise.toml",
  ".dockerignore",
]
run = """
#!/usr/bin/env bash
set -euo pipefail
command -v docker >/dev/null 2>&1 || { echo "check:linux-portability: refusing — docker is unavailable" >&2; exit 1; }
docker info >/dev/null 2>&1 || { echo "check:linux-portability: refusing — the docker daemon is unavailable" >&2; exit 1; }
image=$(docker build --quiet --build-arg "YQ_VERSION=$(mise current yq)" --file test/linux-portability.Dockerfile .)
docker run --rm --network none "$image"
"""

# --- evidence --------------------------------------------------------------
# The measured claims: conformance against external corpora, agreement with the
# yq oracle, and the scale and benchmark budgets. Slow, networked and weekly, so
# it is not part of `check` — but it is a verb, so it runs here and not only on
# a runner.

[tasks."evidence:corpora"]
description = "Fetch the pinned external corpora the evidence run measures against"
run = """
#!/usr/bin/env bash
# Every corpus is pinned — a tag, a commit, or a sha256. An evidence number
# measured against a moving corpus is not evidence.
set -euo pipefail
dir="${YSH_EVIDENCE_DIR:?}"
mkdir -p "$dir"

digest() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1; else shasum -a 256 "$1" | cut -d' ' -f1; fi; }

pin_repo() {
  local name=$1 url=$2 ref=$3 target marker legacy_marker current tmp
  target="$dir/$name"
  marker="$target.pin"
  legacy_marker="$target/.pin"
  if [ -d "$target" ] && [ ! -L "$target" ]; then
    current=
    if [ -f "$marker" ] && [ ! -L "$marker" ]; then
      current=$(cat "$marker")
    elif [ -f "$legacy_marker" ] && [ ! -L "$legacy_marker" ]; then
      current=$(cat "$legacy_marker")
    fi
    if [ "$current" = "$ref" ]; then
      rm -f "$marker"
      printf '%s\n' "$ref" > "$marker"
      # Git is only transport here; retained metadata makes tools discover the
      # corpora as unrelated repositories.
      rm -rf "$target/.git"
      rm -f "$legacy_marker"
      return 0
    fi
  fi

  tmp=$(mktemp -d "$dir/.$name.XXXXXX")
  if git init -q "$tmp" &&
     git -C "$tmp" remote add origin "$url" &&
     git -C "$tmp" fetch -q --depth 1 origin "$ref" &&
     git -C "$tmp" checkout -q --detach FETCH_HEAD &&
     rm -rf "$tmp/.git"; then
    rm -rf "$target"
    mv "$tmp" "$target"
    rm -f "$marker"
    printf '%s\n' "$ref" > "$marker"
  else
    rm -rf "$tmp"
    return 1
  fi
}

pin_file() {
  local name=$1 url=$2 want=$3 target tmp got
  target="$dir/$name"
  if [ -f "$target" ] && [ "$(digest "$target")" = "$want" ]; then return 0; fi

  tmp=$(mktemp "$dir/.$name.XXXXXX")
  if ! curl -fsSL "$url" -o "$tmp"; then
    rm -f "$tmp"
    return 1
  fi
  got=$(digest "$tmp")
  [ "$got" = "$want" ] || { echo "evidence:corpora: refusing — $name is $got, pinned at $want" >&2; rm -f "$tmp"; return 1; }
  rm -rf "$target"
  mv "$tmp" "$target"
}

pin_repo yaml-test-suite https://github.com/yaml/yaml-test-suite.git data-2022-01-17
pin_repo json-schema-test-suite https://github.com/json-schema-org/JSON-Schema-Test-Suite.git fb7372e8763a1417bddc65fa4c911b3e79b57b65
pin_file json-patch-tests.json https://raw.githubusercontent.com/json-patch/json-patch-tests/master/tests.json de3dce3d0d5029fed83007e50b54607750dd3d1478d3c59ca35fdc18fb1a04ae
pin_file json-patch-spec-tests.json https://raw.githubusercontent.com/json-patch/json-patch-tests/master/spec_tests.json a26b050292207033e5cccc5d6102b7bd6f8add7db0d0680e5d46a7ecf40a8c7b
"""

[tasks.evidence]
tools = { go = "1.27.1", jq = "1.8.1" }
description = "Measure conformance, differential agreement, and the scale and benchmark budgets"
depends = ["evidence:corpora"]
run = """
#!/usr/bin/env bash
set -euo pipefail
dir="${YSH_EVIDENCE_DIR:?}"
export YAML_TEST_SUITE_DIR="$dir/yaml-test-suite"
export JSON_SCHEMA_TEST_SUITE_DIR="$dir/json-schema-test-suite"
export YQ_BINARY="$(command -v yq)"
make ysh
make conformance
make toml-conformance
make schema-conformance
JSON_PATCH_TEST_FILE="$dir/json-patch-tests.json" make json-patch-conformance
JSON_PATCH_TEST_FILE="$dir/json-patch-spec-tests.json" make json-patch-conformance
make differential
make fuzz
make presentation
make public-contract
make operator-manifest
make parser-boundaries
make adversarial
make scale
YSH_BENCHMARK_SCALE="${YSH_BENCHMARK_SCALE:-2}" make benchmark
"""

[tasks."evidence:busybox"]
description = "Repeat the conformance, differential, and fuzz evidence with BusyBox AWK"
depends = ["evidence:corpora"]
run = """
#!/usr/bin/env bash
set -euo pipefail
command -v docker >/dev/null 2>&1 || { echo "evidence:busybox: refusing — docker is unavailable" >&2; exit 1; }
docker info >/dev/null 2>&1 || { echo "evidence:busybox: refusing — the docker daemon is unavailable" >&2; exit 1; }
dir="${YSH_EVIDENCE_DIR:?}"
[ -d "$dir/yaml-test-suite" ] || { echo "evidence:busybox: refusing — the YAML test suite is unavailable" >&2; exit 1; }
image=$(docker build --quiet --build-arg "YQ_VERSION=$(mise current yq)" --file test/linux-portability.Dockerfile .)
docker run --rm --network none --volume "$dir:/evidence:ro" "$image" ./test/busybox-evidence-container.sh
"""

[tasks.check]
description = "The Makefile's full battery: build, lint, tests, docs"
depends = ["check:runtime", "check:docs"]

[tasks.push]
description = "Push a checked feature branch for review"
tools = { gh = "2.100.0" }
depends = ["check"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
branch=$(git branch --show-current)
[ -n "$branch" ] && [ "$branch" != main ] || { echo 'push: use a feature branch' >&2; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo 'push: commit the complete change first' >&2; exit 1; }
[ "$(gh api --hostname github.com user --jq .login)" = azohra ] || { echo 'push: expected the azohra account' >&2; exit 1; }
[ "$(gh api --hostname github.com repos/azohra/yaml.sh --jq '.id == 159573143 and .private == false')" = true ] || { echo 'push: repository identity changed' >&2; exit 1; }
for url in "$(git remote get-url --all origin)" "$(git remote get-url --push --all origin)"; do
  case "$url" in
    https://github.com/azohra/yaml.sh|https://github.com/azohra/yaml.sh.git|git@github.com:azohra/yaml.sh.git) ;;
    *) echo 'push: unexpected remote destination' >&2; exit 1 ;;
  esac
done
git push --set-upstream origin "refs/heads/$branch:refs/heads/$branch"
'''

[tasks.changelog]
description = "Render the changelog or export structured Git history"
usage = 'flag "--json" help="Export git-cliff context without the Markdown archive"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
if [ "${usage_json:-false}" = true ]; then
  exec git cliff --config-url "{{vars.changelog_config}}" --context
fi
archive=$(sed -n 's/^## \[\([0-9.]*\)\].*/\1/p' CHANGELOG.md | head -n 1)
printf '# Changelog\n\n'
git cliff --config-url "{{vars.changelog_config}}" "v$archive..HEAD"
printf '\n'
awk '/^## \[/{history=1} history' CHANGELOG.md
'''

[tasks.release]
description = "Attach ysh to the release for the checked-out tag, deploy the website, and propose the formula"
tools = { gh = "2.100.0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
digest() { if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | cut -d' ' -f1; else shasum -a 256 "$1" | cut -d' ' -f1; fi; }
tag=$(git describe --tags --exact-match --match 'v[0-9]*' 2>/dev/null || true)
[[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo 'release: check out a v* tag; publishing the draft creates it' >&2; exit 1; }
[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" = false ] || { echo "release: $tag is still a draft" >&2; exit 1; }

# A version names a change to the program. Build ysh as the previous version
# and compare bytes; a release whose ysh is identical is refused.
previous=$(gh release list --exclude-drafts --exclude-pre-releases --json tagName --jq "[.[].tagName | select(. != \"$tag\")] | first")
if [[ "$previous" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
  make .release/ysh RELEASE_VERSION="${previous#v}" >/dev/null
  if [ "$(digest .release/ysh)" = "$(gh release download "$previous" --pattern ysh.sha256 --output - | cut -d' ' -f1)" ]; then
    echo "release: ysh is byte-identical to $previous; a new version needs a change to the program" >&2
    exit 1
  fi
fi

mise run build -- "$tag" >&2
gh release upload "$tag" .release/ysh .release/ysh.sha256 >&2
wrangler deploy --tag "$tag-$(git rev-parse --short HEAD)" >&2
mise run homebrew:propose -- "$tag"
'''

[tasks."homebrew:propose"]
description = "Open the pull request in homebrew-tools that moves the ysh formula to a published release"
tools = { gh = "2.100.0" }
usage = '''arg "<tag>"
flag "--dry-run" help="Print the formula change without writing to homebrew-tools"'''
run = '''
#!/usr/bin/env bash
# Needs HOMEBREW_TOOLS_TOKEN: a token that may write contents and pull requests
# in azohra/homebrew-tools. In CI it is minted per run from the Bosun app.
set -euo pipefail
tag=${usage_tag:?}
tap=azohra/homebrew-tools
[[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
[ "$(gh release view "$tag" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')" = true ] || { echo "homebrew:propose: $tag is not a published release" >&2; exit 1; }
scratch=$(mktemp -d); trap 'rm -rf "$scratch"' EXIT
gh release download "$tag" --pattern ysh --pattern ysh.sha256 --dir "$scratch"
expected=$(sed -nE 's/^([0-9a-f]{64})  ysh$/\1/p' "$scratch/ysh.sha256")
actual=$(if command -v sha256sum >/dev/null 2>&1; then sha256sum "$scratch/ysh"; else shasum -a 256 "$scratch/ysh"; fi | cut -d' ' -f1)
[[ "$expected" =~ ^[0-9a-f]{64}$ ]] && [ "$actual" = "$expected" ] || { echo 'homebrew:propose: release bytes do not match the checksum' >&2; exit 1; }

export GH_TOKEN="${HOMEBREW_TOOLS_TOKEN:-${GH_TOKEN:-${GITHUB_TOKEN:-}}}"
current=$(gh api "repos/$tap/contents/ysh.rb" --jq .content | base64 -d)
blob=$(gh api "repos/$tap/contents/ysh.rb" --jq .sha)
updated=$(printf '%s\n' "$current" | sed -E \
  -e "s@/releases/download/v[0-9]+[.][0-9]+[.][0-9]+/ysh@/releases/download/$tag/ysh@" \
  -e "s@^  sha256 \"[0-9a-f]+\"@  sha256 \"$actual\"@")
if [ "$updated" = "$current" ]; then echo "homebrew:propose: the formula already points at $tag"; exit 0; fi
if [ "${usage_dry_run:-false}" = true ]; then diff <(printf '%s\n' "$current") <(printf '%s\n' "$updated") || true; exit 0; fi

branch="ysh-${tag#v}"
main=$(gh api "repos/$tap/git/ref/heads/main" --jq .object.sha)
gh api "repos/$tap/git/refs" -f ref="refs/heads/$branch" -f sha="$main" >/dev/null 2>&1 || true
gh api -X PUT "repos/$tap/contents/ysh.rb" \
  -f message="chore(deps): update ysh to $tag" -f branch="$branch" -f sha="$blob" \
  -f content="$(printf '%s\n' "$updated" | base64)" \
  -f 'committer[name]=azohra-bosun[bot]' -f 'committer[email]=325107280+azohra-bosun[bot]@users.noreply.github.com' >/dev/null
gh pr create --repo "$tap" --head "$branch" --base main \
  --title "chore(deps): update ysh to $tag" \
  --body "YAML.sh $tag is published. The formula moves to its executable and checksum, verified against the release's own \`ysh.sha256\`."
'''

[tasks.build]
description = "Build the executable and the website"
usage = 'arg "[tag]" default="vdev"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag=${usage_tag:-vdev}
[[ "$tag" = vdev || "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || exit 1
make build RELEASE_VERSION="${tag#v}"
[ "$(sh .release/ysh --version)" = "$tag" ]
'''

[tasks.deploy]
description = "Build the website for the latest published release and deploy it"
tools = { gh = "2.100.0" }
usage = 'arg "[tag]" help="Published release to stamp the site with; defaults to the latest"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
tag=${usage_tag:-$(gh release view --json tagName --jq .tagName)}
[ "$(gh release view "$tag" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')" = true ] || { echo "deploy: $tag is not a published release" >&2; exit 1; }
mise run build -- "$tag" >&2
wrangler deploy --tag "$tag-$(git rev-parse --short HEAD)"
'''
