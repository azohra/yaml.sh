  <g transform="translate(640 73)">
    <rect width="500" height="274" rx="12" fill="#1a211a" stroke="#445040" stroke-width="2"/>
    <path d="M0 54h500" stroke="#445040"/>
    <circle cx="27" cy="27" r="8" fill="#d8ff45"/>
    <circle cx="54" cy="27" r="8" fill="#71806b"/>
    <circle cx="81" cy="27" r="8" fill="#71806b"/>
    <text x="27" y="112" fill="#d8ff45" font-family="ui-monospace,monospace" font-size="23" font-weight="800">$</text>
    <text x="56" y="112" fill="#f5f1e8" font-family="ui-monospace,monospace" font-size="23">ysh '.server.port' config.yml</text>
    <text x="27" y="170" fill="#d8ff45" font-family="ui-monospace,monospace" font-size="40" font-weight="850">8080</text>
    <text x="27" y="229" fill="#8e9b89" font-family="ui-monospace,monospace" font-size="16">one file · /bin/sh + awk</text>
